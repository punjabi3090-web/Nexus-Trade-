<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Promotions & VIP Levels | NEXUS TRADE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #e5e7eb 50%, #f3f4f6 100%);
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 10%, rgba(251, 191, 36, 0.25) 0%, rgba(255, 255, 255, 0.9) 60%),
                  linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
    }

    .bg-scene svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(6px, 1vh, 12px) clamp(10px, 3.2vw, 16px);
      gap: clamp(4px, 0.8vh, 8px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      height: clamp(38px, 5vh, 46px);
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mini svg {
      width: clamp(28px, 4vw, 34px);
      height: clamp(24px, 3.5vw, 28px);
    }

    .brand-mini-text {
      display: flex;
      flex-direction: column;
      line-height: 0.95;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(14px, 3.8vw, 18px);
      letter-spacing: 0.5px;
    }

    .brand-mini-text span:first-child { color: #070312; }
    .brand-mini-text span:last-child { color: #d97706; text-shadow: 0 1px 2px rgba(0,0,0,0.15); }

    .top-icons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-btn {
      background: #120a22;
      border: 1.5px solid #f59e0b;
      border-radius: 50%;
      width: clamp(30px, 4.2vh, 36px);
      height: clamp(30px, 4.2vh, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.35);
    }

    .icon-btn svg {
      width: clamp(14px, 2vh, 17px);
      height: clamp(14px, 2vh, 17px);
      fill: #fbbf24;
    }

    .notification-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: #ef4444;
      color: #ffffff;
      font-size: 8.5px;
      font-weight: 800;
      min-width: 14px;
      height: 14px;
      padding: 0 3px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ffffff;
    }

    .notification-badge.hidden {
      display: none;
    }

    .notif-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(7, 3, 18, 0.75);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .notif-modal-backdrop.open {
      display: flex;
    }

    .notif-modal-card {
      width: 100%;
      max-width: 420px;
      max-height: 86dvh;
      background: linear-gradient(180deg, #140b26 0%, #070312 100%);
      border: 1.5px solid #fbbf24;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #f8fafc;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }

    .notif-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(251, 191, 36, 0.25);
      padding-bottom: 8px;
      flex-shrink: 0;
    }

    .notif-modal-title {
      font-size: 13px;
      font-weight: 900;
      color: #fbbf24;
    }

    .notif-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #ffffff;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .notif-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 2px;
    }

    .notif-empty-state {
      padding: 26px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #cbd5e1;
    }

    .notif-item-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notif-item-img {
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      background: #070312;
      display: block;
    }

    .notif-item-title {
      font-size: 13px;
      font-weight: 900;
      color: #fbbf24;
    }

    .notif-item-msg {
      font-size: 11.5px;
      color: #e2e8f0;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .notif-item-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .notif-item-meta {
      font-size: 9px;
      color: #94a3b8;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .notif-brand-link {
      color: #fbbf24;
      font-weight: 800;
    }

    .notif-action-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .notif-action-btn {
      border: none;
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 10.5px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .notif-action-btn:active {
      transform: scale(0.96);
    }

    .notif-save-btn {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      color: #070312;
    }

    .notif-copy-btn {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #070312;
    }

    .promo-scroll-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      min-height: 0;
    }

    .promo-hero-banner {
      background: linear-gradient(135deg, #1a0f33 0%, #070312 100%);
      border: 1.5px solid #fbbf24;
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(251, 191, 36, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .promo-hero-title {
      font-size: 14px;
      font-weight: 900;
      font-style: italic;
      color: #fbbf24;
    }

    .promo-hero-sub {
      font-size: 10px;
      color: #cbd5e1;
      font-weight: 600;
      margin-top: 2px;
    }

    .promo-bal-pill {
      background: rgba(16, 185, 129, 0.16);
      border: 1px solid #34d399;
      color: #34d399;
      border-radius: 10px;
      padding: 6px 10px;
      text-align: right;
      flex-shrink: 0;
    }

    .promo-bal-lbl {
      font-size: 8px;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 800;
    }

    .promo-bal-val {
      font-size: 12px;
      font-weight: 900;
      color: #34d399;
    }

    .vip-levels-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vip-card {
      background: linear-gradient(135deg, #160c2c 0%, #090414 100%);
      border: 1.3px solid rgba(251, 191, 36, 0.42);
      border-radius: 13px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
    }

    .vip-card.active-tier {
      border-color: #34d399;
      box-shadow: 0 0 16px rgba(52, 211, 153, 0.22);
    }

    .vip-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .vip-card-title {
      font-size: 12.5px;
      font-weight: 900;
      font-style: italic;
      color: #ffffff;
    }

    .vip-status-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .vip-status-active {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid #10b981;
      color: #34d399;
    }

    .vip-status-unlocked {
      background: rgba(251, 191, 36, 0.16);
      border: 1px solid #fbbf24;
      color: #fbbf24;
    }

    .vip-status-locked {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .vip-metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .vip-metric-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 4px;
    }

    .vip-metric-lbl {
      font-size: 8px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
    }

    .vip-metric-val {
      font-size: 11.5px;
      font-weight: 900;
      color: #fbbf24;
      margin-top: 2px;
    }

    .vip-metric-val.green {
      color: #34d399;
    }

    .vip-desc-text {
      font-size: 9.5px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    .vip-prog-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    .vip-prog-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #34d399);
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: linear-gradient(135deg, #120a22 0%, #070312 100%);
      border: 1.5px solid #fbbf24;
      border-radius: 14px;
      padding: clamp(5px, 0.8vh, 8px) 4px;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.35);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: #cbd5e1;
      font-size: clamp(9.5px, 2.5vw, 11px);
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-item.active, .nav-item:hover {
      color: #fbbf24;
    }

    .nav-item svg {
      width: clamp(16px, 2.3vh, 19px);
      height: clamp(16px, 2.3vh, 19px);
      fill: currentColor;
    }

    .toast-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 999;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      max-width: 92%;
      text-align: center;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    .toast-banner.show { transform: translateX(-50%) translateY(0); }
    .toast-success { background: #132e24; border: 1px solid #10b981; color: #a7f3d0; }
    .toast-error { background: #3b1219; border: 1px solid #ef4444; color: #fecaca; }
  </style>
</head>
<body>

  <div id="toastBox" class="toast-banner"></div>

  <div id="notifModal" class="notif-modal-backdrop" onclick="if(event.target.id==='notifModal') closeNotifModal()">
    <div class="notif-modal-card" onclick="event.stopPropagation()">
      <div class="notif-modal-header">

  <div class="bg-scene">
    <svg viewBox="0 0 440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b45309" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0.15"/>
        </linearGradient>
        <linearGradient id="goldWaveFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>

      </defs>
      <path d="M -20 0 Q 110 80, 230 40 T 460 20 L 460 150 L -20 150 Z" fill="url(#goldWaveFill)"/>

      <path d="M -20 880 Q 110 820, 230 860 T 460 880" fill="none" stroke="url(#goldWaveGrad)" stroke-width="3"/>

  <div class="app-viewport">

          <path d="M3 29L13 7L21 21L31 5" stroke="#d97706" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 5H33V14" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-mini-text">

          <span>TRADE</span>
        </div>
      </div>

      <div class="top-icons">
        <button type="button" class="icon-btn" onclick="openNotifModal()" title="Notifications" aria-label="Notifications">
          <span id="notifBadge" class="notification-badge hidden">0</span>
          <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
        </button>
        <button type="button" class="icon-btn" onclick="showToast('Live VIP tiers synced from DB', 'success')" title="VIP Tiers">
          <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2z"/></svg>
        </button>
      </div>
    </header>

    <main class="promo-scroll-area">
      <div class="promo-hero-banner">
        <div>
          <div class="promo-hero-title">VIP LEVEL PLANS</div>
          <div class="promo-hero-sub" id="promoActiveTierSub">Syncing live tier requirements from database...</div>
        </div>
        <div class="promo-bal-pill">
          <div class="promo-bal-lbl">Balance</div>
          <div class="promo-bal-val" id="promoUserBalance">$0.00</div>
        </div>
      </div>

      <div id="vipLevelsList" class="vip-levels-list">
        <div class="vip-card">
          <div class="vip-card-title">Loading VIP levels...</div>
        </div>

    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>

  <script>
    const SUPABASE_URL = "https://mzqduhqtdlvymeiouhxi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_NtapCzhK706QFomb1adwjQ_luVqjlfu";
    const SEEN_NOTIF_KEY = "nexus_seen_announcement_ids";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let vipLevelsCache = [];
    let currentBalance = 0;
    let currentVipLevel = 1;
    let currentUserId = null;
    let vipChannel = null;
    let profileChannel = null;
    let notifChannel = null;
    let currentAnnouncements = [];

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toastBox');
      if (!box) return;
      box.textContent = msg;
      box.className = `toast-banner show ${type === 'success' ? 'toast-success' : 'toast-error'}`;
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { box.classList.remove('show'); }, 2600);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function computeQualifiedLevel(balance, levels) {
      const activeSorted = [...(levels || [])]
        .filter(l => l && l.is_active !== false)
        .sort((a, b) => Number(a.level) - Number(b.level));

      let qualified = activeSorted.length ? Number(activeSorted[0].level) : 1;
      for (const lvlRow of activeSorted) {
        if (Number(balance) >= Number(lvlRow.min_balance || 0)) {
          qualified = Number(lvlRow.level);
        }
      }
      return qualified;
    }

    function renderVipLevels() {
      const listEl = document.getElementById('vipLevelsList');
      const balEl = document.getElementById('promoUserBalance');
      const subEl = document.getElementById('promoActiveTierSub');
      if (!listEl) return;

      balEl.textContent = `$${Number(currentBalance || 0).toFixed(2)}`;

      const levels = [...(vipLevelsCache || [])]
        .filter(l => l && l.is_active !== false)
        .sort((a, b) => Number(a.level) - Number(b.level));

      if (!levels.length) {
        listEl.innerHTML = `<div class="vip-card"><div class="vip-card-title">No VIP plans configured in DB.</div></div>`;
        return;
      }

      const qualifiedLvl = computeQualifiedLevel(currentBalance, levels);
      const effectiveActiveLvl = Math.max(Number(currentVipLevel || 1), qualifiedLvl);
      const activePlanObj = levels.find(l => Number(l.level) === effectiveActiveLvl) || levels[0];

      subEl.textContent = `Current: LEVEL-${effectiveActiveLvl} (${activePlanObj.name}) • ${Number(activePlanObj.daily_rate).toFixed(1)}% Daily`;

      listEl.innerHTML = levels.map((lvlRow) => {
        const lvlNum = Number(lvlRow.level);
        const minBal = Math.max(0.01, Number(lvlRow.min_balance || 20));
        const rate = Number(lvlRow.daily_rate || 1.8).toFixed(1);
        const limitCount = Number(lvlRow.daily_trades_limit || 1);
        const isCurrentTier = lvlNum === effectiveActiveLvl;
        const isUnlocked = Number(currentBalance) >= minBal || lvlNum <= Number(currentVipLevel || 1);
        const pct = Math.min(100, Math.max(0, Math.round((Number(currentBalance) / minBal) * 100)));

        let badgeHtml = `<span class="vip-status-tag vip-status-locked">🔒 Locked ($${minBal.toFixed(0)} Min)</span>`;
        if (isCurrentTier) {
          badgeHtml = `<span class="vip-status-tag vip-status-active">★ Active Tier</span>`;
        } else if (isUnlocked) {
          badgeHtml = `<span class="vip-status-tag vip-status-unlocked">✓ Unlocked</span>`;
        }

        return `
          <article class="vip-card ${isCurrentTier ? 'active-tier' : ''}">
            <div class="vip-card-head">
              <div class="vip-card-title">LEVEL-${lvlNum}: ${escapeHtml(lvlRow.name || 'VIP Plan')}</div>
              ${badgeHtml}
            </div>
            <div class="vip-metrics-grid">
              <div class="vip-metric-box">
                <div class="vip-metric-lbl">Daily Rate</div>
                <div class="vip-metric-val green">${rate}%</div>
              </div>
              <div class="vip-metric-box">
                <div class="vip-metric-lbl">Min Balance</div>
                <div class="vip-metric-val">$${minBal.toFixed(2)}</div>
              </div>
              <div class="vip-metric-box">
                <div class="vip-metric-lbl">Daily Trade</div>
                <div class="vip-metric-val">${limitCount} / Day</div>
              </div>
            </div>
            ${lvlRow.description ? `<div class="vip-desc-text">${escapeHtml(lvlRow.description)}</div>` : ''}
            <div class="vip-prog-track">
              <div class="vip-prog-fill" style="width:${pct}%;"></div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function loadVipLevelsFromDb() {
      const { data, error } = await supabaseClient
        .from('vip_levels')
        .select('*')
        .order('level', { ascending: true });

      if (!error && Array.isArray(data) && data.length > 0) {
        vipLevelsCache = data;
      } else if (!vipLevelsCache.length) {
        vipLevelsCache = [
          { level: 1, name: 'VIP Trader Plan', min_balance: 20, daily_rate: 1.8, daily_trades_limit: 1, description: 'Entry trading tier unlocked from $20.00 USDT balance.', is_active: true },
          { level: 2, name: 'Pro Elite Plan', min_balance: 200, daily_rate: 2.0, daily_trades_limit: 1, description: 'Enhanced daily return tier for active growing accounts.', is_active: true },
          { level: 3, name: 'Master Venture Plan', min_balance: 500, daily_rate: 2.5, daily_trades_limit: 1, description: 'High-yield tier for higher balance & volume traders.', is_active: true }
        ];
      }
      renderVipLevels();
    }

    async function loadUserLevelState() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session || !session.user) return;
      currentUserId = session.user.id;

      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('balance, vip_level')
        .eq('id', currentUserId)
        .maybeSingle();

      if (profile) {
        currentBalance = Number(profile.balance ?? 0);
        currentVipLevel = Number(profile.vip_level ?? 1);
      }
      renderVipLevels();
    }

    function subscribeRealtimeVipAndProfile() {
      if (!vipChannel) {
        vipChannel = supabaseClient
          .channel('promo_vip_levels_live')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'vip_levels' },
            async () => {
              await loadVipLevelsFromDb();
            }
          )
          .subscribe();
      }

      if (currentUserId && !profileChannel) {
        profileChannel = supabaseClient
          .channel(`promo_profile_${currentUserId}`)
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'profiles', filter: `id=eq.${currentUserId}` },
            async () => {
              await loadUserLevelState();
            }
          )
          .subscribe();
      }
    }

    function formatAnnouncedUtcDateTime(rawCreatedAt) {
      const d = rawCreatedAt ? new Date(rawCreatedAt) : new Date();
      const target = Number.isNaN(d.getTime()) ? new Date() : d;
      const pad2 = (n) => String(n).padStart(2, '0');
      return `${target.getUTCFullYear()}-${pad2(target.getUTCMonth() + 1)}-${pad2(target.getUTCDate())} UTC ${pad2(target.getUTCHours())}:${pad2(target.getUTCMinutes())}:${pad2(target.getUTCSeconds())}`;
    }

    function readSeenIds() {
      try {
        const raw = localStorage.getItem(SEEN_NOTIF_KEY);
        const arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr.map(String) : [];
      } catch (e) { return []; }
    }

    function writeSeenIds(ids) {
      try {
        localStorage.setItem(SEEN_NOTIF_KEY, JSON.stringify(Array.from(new Set(ids.map(String))).slice(0, 100)));
      } catch (e) {}
    }

    function updateNotifBadge() {
      const badge = document.getElementById('notifBadge');
      if (!badge) return;
      const seen = readSeenIds();
      const unreadCount = currentAnnouncements.filter(n => n && n.id != null && !seen.includes(String(n.id))).length;
      if (unreadCount > 0) {
        badge.textContent = unreadCount > 99 ? '99+' : String(unreadCount);
        badge.classList.remove('hidden');
      } else {
        badge.textContent = '0';
        badge.classList.add('hidden');
      }
    }

    function renderAnnouncementsModal() {
      const container = document.getElementById('notifModalList');
      if (!container) return;
      if (!currentAnnouncements.length) {
        container.innerHTML = `<div class="notif-empty-state">No Notification yet</div>`;
        return;
      }
      container.innerHTML = currentAnnouncements.map((item) => {
        const imgUrl = String(item.image_url || '').trim();
        const imgHtml = imgUrl
          ? `<img src="${escapeHtml(imgUrl)}" alt="Notification Picture" class="notif-item-img" onerror="this.style.display='none'" />`
          : '';
        return `
          <article class="notif-item-card">
            ${imgHtml}
            <div class="notif-item-title">${escapeHtml(item.title || 'Announcement')}</div>
            <div class="notif-item-msg">${escapeHtml(item.message || '')}</div>
            <div class="notif-item-footer">
              <div class="notif-item-meta">
                <span class="notif-brand-link">www.NexusTradeLive</span>
                <span>${escapeHtml(formatAnnouncedUtcDateTime(item.created_at))}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function openNotifModal() {
      renderAnnouncementsModal();
      const modal = document.getElementById('notifModal');
      if (modal) modal.classList.add('open');
      const seen = readSeenIds();
      currentAnnouncements.forEach(n => { if (n && n.id != null) seen.push(String(n.id)); });
      writeSeenIds(seen);
      updateNotifBadge();
    }

    function closeNotifModal() {
      const modal = document.getElementById('notifModal');
      if (modal) modal.classList.remove('open');
    }

    async function loadAnnouncements() {
      const { data, error } = await supabaseClient
        .from('broadcast_notifications')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(30);
      if (!error && Array.isArray(data)) {
        currentAnnouncements = data;
        updateNotifBadge();
      }
    }

    function subscribeRealtimeAnnouncements() {
      if (notifChannel) return;
      notifChannel = supabaseClient
        .channel('public:broadcast_notifications:promo')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'broadcast_notifications' }, async () => {
          await loadAnnouncements();
        })
        .subscribe();
    }

    (async function initPromotions() {
      await loadVipLevelsFromDb();
      await loadUserLevelState();
      subscribeRealtimeVipAndProfile();
      await loadAnnouncements();
      subscribeRealtimeAnnouncements();
    })();
  </script>
</body>
</html>
