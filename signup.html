<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create Account | NEXUS TRADE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #070312;
      --gold-main: #f59e0b;
      --gold-bright: #fbbf24;
      --gold-border: rgba(251, 191, 36, 0.6);
      --input-bg: rgba(18, 12, 34, 0.85);
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background Vector Canvas (Gold & Purple Glowing Waves + Candlesticks) */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 25%, #2a1548 0%, #0d0521 48%, #05020d 100%);
    }

    .bg-scene svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Main Auto-Fit Viewport Container */
    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(8px, 1.5vh, 14px) clamp(12px, 3.5vw, 18px) clamp(12px, 2vh, 20px);
    }

    /* Top Header Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-mini-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.35);
    }

    .brand-mini-text {
      display: flex;
      flex-direction: column;
      line-height: 0.95;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(12px, 3.3vw, 14px);
      letter-spacing: 0.4px;
    }

    .brand-mini-text span:first-child { color: #ffffff; }
    .brand-mini-text span:last-child { color: #fbbf24; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(7px, 2.2vw, 12px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: #e5e7eb;
      font-size: clamp(10px, 2.6vw, 11.5px);
      font-weight: 500;
      transition: 0.2s;
    }

    .nav-item:hover { color: #fbbf24; }
    .nav-item svg {
      width: 13px;
      height: 13px;
      fill: #f59e0b;
      flex-shrink: 0;
    }

    /* Hero Brand Center Section */
    .hero-brand {
      text-align: center;
      margin-top: clamp(2px, 0.6vh, 6px);
      flex-shrink: 0;
    }

    .hero-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hero-title {
      font-size: clamp(24px, 6.8vw, 32px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.8px;
      line-height: 1;
      text-shadow: 0 0 22px rgba(245, 158, 11, 0.45);
    }

    .hero-title .white { color: #ffffff; }
    .hero-title .gold {
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-tagline {
      font-size: clamp(10.5px, 2.9vw, 12.5px);
      margin-top: 4px;
      font-weight: 500;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .hero-tagline span {
      color: #fbbf24;
      font-weight: 600;
    }

    /* Glowing Main Form Card */
    .form-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: clamp(14px, 2.4vh, 22px);
      margin-bottom: clamp(6px, 1.5vh, 14px);
      min-height: 0;
    }

    .form-card {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 560px;
      background: linear-gradient(180deg, rgba(16, 9, 32, 0.92) 0%, rgba(10, 6, 22, 0.96) 100%);
      border: 1.5px solid #f59e0b;
      border-radius: 20px;
      box-shadow:
        0 0 22px rgba(245, 158, 11, 0.35),
        inset 0 0 18px rgba(245, 158, 11, 0.15);
      padding: clamp(24px, 3.6vh, 32px) clamp(12px, 3.5vw, 18px) clamp(10px, 1.8vh, 16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Glowing Pill Badge: Create Account */
    .card-badge {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -52%);
      background: linear-gradient(180deg, #201308 0%, #0d061f 100%);
      border: 1.5px solid #f59e0b;
      border-radius: 999px;
      padding: clamp(5px, 0.9vh, 8px) clamp(18px, 5vw, 26px);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.55), inset 0 0 10px rgba(245, 158, 11, 0.2);
      z-index: 5;
    }

    .card-badge svg {
      width: clamp(18px, 4.5vw, 22px);
      height: clamp(18px, 4.5vw, 22px);
      fill: #fbbf24;
    }

    .card-badge-text {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 800;
      font-style: italic;
    }

    .card-badge-text .white { color: #ffffff; }
    .card-badge-text .gold { color: #fbbf24; }

    /* Form Fields Layout */
    #signupForm {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      gap: clamp(5px, 0.85vh, 8px);
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      height: clamp(33px, 4.6vh, 40px);
      background: var(--input-bg);
      border: 1px solid rgba(245, 158, 11, 0.38);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .input-icon-box {
      width: clamp(34px, 9vw, 40px);
      height: 100%;
      background: linear-gradient(180deg, rgba(217, 119, 6, 0.55) 0%, rgba(180, 83, 9, 0.65) 100%);
      border-right: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-icon-box svg {
      width: 15px;
      height: 15px;
      fill: #fef3c7;
    }

    .input-field {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: clamp(11.5px, 3.1vw, 13px);
      padding: 0 10px;
      min-width: 0;
    }

    .input-field::placeholder {
      color: #cbd5e1;
      opacity: 0.82;
    }

    /* Email Code Row with Get Code Button */
    .code-group {
      display: flex;
      align-items: center;
      gap: 7px;
      height: clamp(33px, 4.6vh, 40px);
    }

    .code-group .input-row {
      height: 100%;
      flex: 1;
    }

    .btn-get-code {
      height: 100%;
      padding: 0 clamp(10px, 3vw, 14px);
      border-radius: 8px;
      border: 1px solid #fbbf24;
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 50%, #b45309 100%);
      color: #ffffff;
      font-size: clamp(11px, 2.9vw, 12.5px);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
      transition: 0.2s;
    }

    .btn-get-code:active { transform: scale(0.97); }
    .btn-get-code:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-get-code svg { width: 13px; height: 13px; fill: #ffffff; }

    /* Country Code Selector inside Phone Row */
    .country-select-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px 0 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.22);
      height: 65%;
      flex-shrink: 0;
    }

    .country-select {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: clamp(11px, 3vw, 12.5px);
      font-weight: 600;
      cursor: pointer;
      padding-right: 2px;
    }

    .country-select option {
      background: #140b29;
      color: #ffffff;
    }

    /* Password Toggle Eye Button */
    .eye-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 0 10px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #e2e8f0;
    }

    .eye-btn svg {
      width: 16px;
      height: 16px;
      stroke: #e2e8f0;
      fill: none;
      stroke-width: 2;
    }

    /* Terms & Conditions Checkbox */
    .terms-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 1px 4px;
      font-size: clamp(11px, 2.9vw, 12px);
      color: #e2e8f0;
    }

    .terms-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border: 1.5px solid #fbbf24;
      border-radius: 3px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
    }

    .terms-row input[type="checkbox"]:checked {
      background: #f59e0b;
      border-color: #fbbf24;
    }

    .terms-row input[type="checkbox"]:checked::before {
      content: "✓";
      color: #070312;
      font-size: 11px;
      font-weight: 900;
    }

    .terms-row a {
      color: #fbbf24;
      text-decoration: underline;
      font-weight: 600;
    }

    /* Bottom Action Buttons Row */
    .actions-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-signup-main {
      flex: 1;
      height: clamp(38px, 5.2vh, 45px);
      border-radius: 11px;
      border: 1.5px solid #fde047;
      background: linear-gradient(90deg, #b45309 0%, #f59e0b 45%, #d97706 100%);
      color: #ffffff;
      font-size: clamp(14px, 3.8vw, 16px);
      font-weight: 800;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: 0.2s;
    }

    .btn-signup-main:active { transform: scale(0.98); }
    .btn-signup-main:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-login-link {
      height: clamp(38px, 5.2vh, 45px);
      padding: 0 clamp(14px, 3.8vw, 20px);
      border-radius: 11px;
      border: 1.5px solid #f59e0b;
      background: rgba(18, 10, 36, 0.9);
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn-login-link:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #fbbf24;
    }

    /* Toast Notification Banner */
    .toast-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 999;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      max-width: 92%;
      text-align: center;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .toast-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-error {
      background: #3b0d1e;
      border: 1px solid #f43f5e;
      color: #fecdd3;
    }

    .toast-success {
      background: #132e24;
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <!-- Toast Message Box -->
  <div id="toastBox" class="toast-banner"></div>

  <!-- Gold & Purple Globe Candlestick Background -->
  <div class="bg-scene">
    <svg viewBox="0 0 440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b45309" stop-opacity="0.1"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="goldWaveFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#070312" stop-opacity="0"/>
        </linearGradient>
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Subtle Grid -->
      <g stroke="rgba(245,158,11,0.08)" stroke-width="1">
        <line x1="0" y1="160" x2="440" y2="160"/>
        <line x1="0" y1="220" x2="440" y2="220"/>
        <line x1="0" y1="780" x2="440" y2="780"/>
        <line x1="0" y1="830" x2="440" y2="830"/>
        <line x1="80" y1="0" x2="80" y2="900"/>
        <line x1="220" y1="0" x2="220" y2="900"/>
        <line x1="360" y1="0" x2="360" y2="900"/>
      </g>

      <!-- Top Candlesticks Left -->
      <g fill="#d97706" stroke="#fbbf24" stroke-width="1" opacity="0.55">
        <line x1="22" y1="90" x2="22" y2="165"/><rect x="18" y="108" width="8" height="35"/>
        <line x1="38" y1="115" x2="38" y2="195"/><rect x="34" y="132" width="8" height="42"/>
        <line x1="54" y1="140" x2="54" y2="225"/><rect x="50" y="158" width="8" height="45"/>
        <line x1="70" y1="125" x2="70" y2="205"/><rect x="66" y="145" width="8" height="38"/>
      </g>

      <!-- Top Candlesticks Right -->
      <g fill="#d97706" stroke="#fde047" stroke-width="1" opacity="0.55">
        <line x1="360" y1="190" x2="360" y2="265"/><rect x="356" y="205" width="8" height="38"/>
        <line x1="376" y1="165" x2="376" y2="245"/><rect x="372" y="182" width="8" height="40"/>
        <line x1="392" y1="145" x2="392" y2="225"/><rect x="388" y="160" width="8" height="42"/>
        <line x1="408" y1="120" x2="408" y2="200"/><rect x="404" y="138" width="8" height="36"/>
      </g>

      <!-- Upper Glowing Ribbon Wave -->
      <path d="M -20 230 Q 110 280, 230 245 T 460 175 L 460 310 L -20 310 Z" fill="url(#goldWaveFill)"/>
      <path d="M -20 230 Q 110 280, 230 245 T 460 175" fill="none" stroke="url(#goldWaveGrad)" stroke-width="3" filter="url(#goldGlow)"/>

      <!-- Bottom Candlesticks -->
      <g fill="#b45309" stroke="#f59e0b" stroke-width="1" opacity="0.5">
        <line x1="45" y1="765" x2="45" y2="835"/><rect x="41" y="780" width="8" height="34"/>
        <line x1="65" y1="780" x2="65" y2="850"/><rect x="61" y="795" width="8" height="32"/>
        <line x1="85" y1="755" x2="85" y2="825"/><rect x="81" y="772" width="8" height="30"/>
        <line x1="125" y1="775" x2="125" y2="845"/><rect x="121" y="790" width="8" height="35"/>
        <line x1="165" y1="760" x2="165" y2="835"/><rect x="161" y="775" width="8" height="38"/>
        <line x1="205" y1="785" x2="205" y2="860"/><rect x="201" y="800" width="8" height="36"/>
        <line x1="245" y1="770" x2="245" y2="845"/><rect x="241" y="788" width="8" height="32"/>
        <line x1="285" y1="755" x2="285" y2="830"/><rect x="281" y="770" width="8" height="38"/>
        <line x1="325" y1="775" x2="325" y2="850"/><rect x="321" y="792" width="8" height="34"/>
        <line x1="365" y1="760" x2="365" y2="835"/><rect x="361" y="778" width="8" height="35"/>
      </g>

      <!-- Bottom Glowing Ribbon Waves -->
      <path d="M -20 800 Q 120 885, 260 830 T 460 795 L 460 910 L -20 910 Z" fill="url(#goldWaveFill)"/>
      <path d="M -20 800 Q 120 885, 260 830 T 460 795" fill="none" stroke="url(#goldWaveGrad)" stroke-width="3.5" filter="url(#goldGlow)"/>
    </svg>
  </div>

  <!-- Main Responsive Viewport -->
  <div class="app-viewport">

    <!-- Top Header Navigation -->
    <header class="top-bar">
      <div class="brand-mini">
        <svg width="28" height="24" viewBox="0 0 40 34" fill="none">
          <path d="M3 29L13 7L21 21L31 5" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 5H33V14" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-mini-divider"></div>
        <div class="brand-mini-text">
          <span>NEXUS</span>
          <span>TRADE</span>
        </div>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
          <span>Packages</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
          <span>Rewards</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/></svg>
          <span>Support</span>
        </a>
      </nav>
    </header>

    <!-- Center Hero Brand Header -->
    <section class="hero-brand">
      <div class="hero-logo-row">
        <svg width="38" height="34" viewBox="0 0 46 40" fill="none">
          <defs>
            <linearGradient id="barGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#b45309"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
          </defs>
          <rect x="6" y="28" width="5" height="9" rx="1" fill="url(#barGrad)"/>
          <rect x="14" y="23" width="5" height="14" rx="1" fill="url(#barGrad)"/>
          <rect x="22" y="17" width="5" height="20" rx="1" fill="url(#barGrad)"/>
          <rect x="30" y="11" width="5" height="26" rx="1" fill="url(#barGrad)"/>
          <path d="M3 27C15 24 26 16 36 4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M28 4H37V13" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h1 class="hero-title">
          <span class="white">NEXUS</span> <span class="gold">TRADE</span>
        </h1>
      </div>
      <p class="hero-tagline">
        Smart Investment Packages &amp; <span>Daily Profit Ecosystem.</span>
      </p>
    </section>

    <!-- Glowing Form Container -->
    <main class="form-wrapper">
      <div class="form-card">

        <!-- Floating Top Pill Header: Create Account -->
        <div class="card-badge">
          <svg viewBox="0 0 24 24">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <div class="card-badge-text">
            <span class="white">Create</span> <span class="gold">Account</span>
          </div>
        </div>

        <form id="signupForm" autocomplete="off">

          <!-- 1. Full Name -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <input type="text" id="fullName" class="input-field" placeholder="Full Name." required />
          </div>

          <!-- 2. User Name -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <input type="text" id="userName" class="input-field" placeholder="User Name." required />
          </div>

          <!-- 3. Email -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <input type="email" id="email" class="input-field" placeholder="Email." required />
          </div>

          <!-- 4. Email 6 Digits Confirm Code + Get Code Button -->
          <div class="code-group">
            <div class="input-row">
              <div class="input-icon-box">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
              </div>
              <input type="text" id="emailCode" maxlength="6" inputmode="numeric" class="input-field" placeholder="Email 6 Digits Confirm Code." />
            </div>
            <button type="button" id="getCodeBtn" class="btn-get-code">
              <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              <span id="getCodeText">Get Code</span>
            </button>
          </div>

          <!-- 5. Phone No with Country Code -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </div>
            <div class="country-select-wrap">
              <span style="font-size: 13px;">🌐</span>
              <select id="countryCode" class="country-select">
                <option value="+92">+92</option>
                <option value="+971">+971</option>
                <option value="+966">+966</option>
                <option value="+91">+91</option>
                <option value="+44">+44</option>
                <option value="+1">+1</option>
              </select>
            </div>
            <input type="tel" id="phoneNo" class="input-field" placeholder="Phone No with country code." required />
          </div>

          <!-- 6. Password -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <input type="password" id="password" class="input-field" placeholder="Password." minlength="6" required />
            <button type="button" class="eye-btn" onclick="togglePass('password', this)">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <!-- 7. Confirm Password -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <input type="password" id="confirmPassword" class="input-field" placeholder="Confirm password." minlength="6" required />
            <button type="button" class="eye-btn" onclick="togglePass('confirmPassword', this)">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <!-- 8. Referral Code -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
            </div>
            <input type="text" id="referralCode" class="input-field" placeholder="Referral Code." />
          </div>

          <!-- 9. Terms & Conditions -->
          <label class="terms-row">
            <input type="checkbox" id="agreeTerms" required />
            <span>I agree to the <a href="#" onclick="event.preventDefault(); showToast('Terms & Conditions accepted.', 'success')">Terms &amp; Conditions.</a></span>
          </label>

          <!-- 10. Action Buttons: Signup Account + Login -->
          <div class="actions-row">
            <button type="submit" id="signupBtn" class="btn-signup-main">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <span id="signupBtnText">Signup Account</span>
              <span style="font-style: normal; letter-spacing: -2px;">»</span>
            </button>

            <a href="login.html" class="btn-login-link">
              <span>Login</span>
              <span style="color: #fbbf24; font-weight: 900;">→</span>
            </a>
          </div>

        </form>
      </div>
    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://mzqduhqtdlvymeiouhxi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_NtapCzhK706QFomb1adwjQ_luVqjlfu";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showToast(msg, type = 'error') {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.className = `toast-banner show ${type === 'success' ? 'toast-success' : 'toast-error'}`;
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { box.classList.remove('show'); }, 3500);
    }

    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('ref')) {
      document.getElementById('referralCode').value = urlParams.get('ref');
    }

    let codeRequested = false;
    const getCodeBtn = document.getElementById('getCodeBtn');
    const getCodeText = document.getElementById('getCodeText');

    getCodeBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const fullName = document.getElementById('fullName').value.trim();
      const userName = document.getElementById('userName').value.trim();
      const countryCode = document.getElementById('countryCode').value;
      const phoneNo = document.getElementById('phoneNo').value.trim();
      const password = document.getElementById('password').value;
      const referralCode = document.getElementById('referralCode').value.trim();

      if (!email || !email.includes('@')) {
        showToast("Please enter a valid Email address first.");
        return;
      }
      if (!password || password.length < 6) {
        showToast("Enter Password (min 6 chars) before requesting code.");
        return;
      }

      getCodeBtn.disabled = true;
      getCodeText.textContent = "Sending...";

      try {
        const { error } = await supabaseClient.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName || userName,
              username: userName || email.split('@')[0],
              country_code: countryCode,
              phone_no: phoneNo,
              referral_code: referralCode || null
            }
          }
        });

        if (error) throw error;
        codeRequested = true;
        showToast("6-Digit verification code sent to your Email!", "success");

        let sec = 60;
        const timer = setInterval(() => {
          sec--;
          getCodeText.textContent = `${sec}s`;
          if (sec <= 0) {
            clearInterval(timer);
            getCodeBtn.disabled = false;
            getCodeText.textContent = "Get Code";
          }
        }, 1000);
      } catch (err) {
        showToast(err.message || "Failed to send verification code.");
        getCodeBtn.disabled = false;
        getCodeText.textContent = "Get Code";
      }
    });

    const signupForm = document.getElementById('signupForm');
    const signupBtn = document.getElementById('signupBtn');
    const signupBtnText = document.getElementById('signupBtnText');

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const userName = document.getElementById('userName').value.trim();
      const email = document.getElementById('email').value.trim();
      const emailCode = document.getElementById('emailCode').value.trim();
      const countryCode = document.getElementById('countryCode').value;
      const phoneNo = document.getElementById('phoneNo').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const referralCode = document.getElementById('referralCode').value.trim();

      if (password !== confirmPassword) {
        showToast("Password and Confirm Password do not match!");
        return;
      }

      signupBtn.disabled = true;
      signupBtnText.textContent = "Creating...";

      try {
        if (codeRequested && emailCode.length === 6) {
          const { error: verifyErr } = await supabaseClient.auth.verifyOtp({ email: email, token: emailCode, type: 'signup' });
          if (verifyErr) throw verifyErr;
        } else {
          const { error: signUpErr } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: { full_name: fullName, username: userName, country_code: countryCode, phone_no: phoneNo, referral_code: referralCode || null }
            }
          });
          if (signUpErr) throw signUpErr;
        }

        showToast("Account created! Redirecting to Login...", "success");
        setTimeout(() => { window.location.href = "login.html"; }, 1400);
      } catch (err) {
        showToast(err.message || "Signup failed. Please check details.");
        signupBtn.disabled = false;
        signupBtnText.textContent = "Signup Account";
      }
    });
  </script>
</body>
