<!DOCTYPE html>
<html>
<head>
<title>SignUp - Nexus Trade</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#0a0e15;color:white;display:flex;justify-content:center;padding:20px}
.card{background:#151a23;padding:25px;border-radius:16px;width:100%;max-width:380px;border:1px solid #222}
h2{color:#00ff88;text-align:center;margin-bottom:5px}
p.sub{text-align:center;color:#888;font-size:14px;margin-top:0}
label{font-size:13px;color:#aaa;margin-top:12px;display:block;text-align:left}
input,select{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:1px solid #333;background:#0a0e15;color:white;box-sizing:border-box}
.row{display:flex;gap:8px}
.row select{width:40%}
.row input{width:60%}
.terms{display:flex;align-items:center;gap:8px;margin-top:15px;font-size:13px;color:#ccc;text-align:left}
.terms input{width:auto}
.btn{width:100%;background:#00ff88;color:#000;padding:13px;border:none;border-radius:8px;font-weight:bold;margin-top:18px;cursor:pointer;font-size:16px}
a{color:#00ff88;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h2>NEXUS TRADE</h2>
  <p class="sub">Create New Account</p>
  <label>1. Full Name</label><input id="fullName" type="text" placeholder="John Doe">
  <label>2. User Name</label><input id="userName" type="text" placeholder="johndoe123">
  <label>3. Email</label><input id="email" type="email" placeholder="email@gmail.com">
  <label>4. Confirm Code (Optional)</label><input id="confirmCode" type="text" placeholder="Referral Code">
  <label>5. Phone Number</label>
  <div class="row">
    <select id="countryCode">
      <option value="+92">🇵🇰 +92</option><option value="+91">🇮🇳 +91</option><option value="+971">🇦🇪 +971</option><option value="+966">🇸🇦 +966</option><option value="+44">🇬🇧 +44</option><option value="+1">🇺🇸 +1</option>
    </select>
    <input id="phone" type="tel" placeholder="3001234567">
  </div>
  <label>6. Password</label><input id="password" type="password" placeholder="******">
  <label>7. Confirm Password</label><input id="cpassword" type="password" placeholder="******">
  <div class="terms"><input type="checkbox" id="terms"><label for="terms" style="margin:0">8. I agree to Terms & Conditions</label></div>
  <button class="btn" onclick="signUp()">SignUp</button>
  <p style="text-align:center;font-size:14px;margin-top:15px">Already have account? <a href="login.html">Login</a></p>
  <p id="msg" style="text-align:center;font-size:14px;margin-top:10px"></p>
</div>
<script>
  const SUPABASE_URL = "https://mzqduhqtdlvymeiouhxi.supabase.co";
  const SUPABASE_KEY = "sb_publishable_NtapCzhK706QFomb1adwjQ_luVqjlfu";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  async function signUp(){
    const fullName=document.getElementById('fullName').value;
    const userName=document.getElementById('userName').value;
    const email=document.getElementById('email').value;
    const countryCode=document.getElementById('countryCode').value;
    const phone=document.getElementById('phone').value;
    const password=document.getElementById('password').value;
    const cpassword=document.getElementById('cpassword').value;
    const terms=document.getElementById('terms').checked;
    const msg=document.getElementById('msg');
    if(!fullName||!userName||!email||!phone||!password){msg.innerText="All fields required!";msg.style.color="red";return;}
    if(password!==cpassword){msg.innerText="Password not match!";msg.style.color="red";return;}
    if(!terms){msg.innerText="Tick Terms & Conditions";msg.style.color="red";return;}
    msg.innerText="Creating account...";msg.style.color="#00ff88";
    const {data,error}=await supabaseClient.from('users').insert([{full_name:fullName,user_name:userName,email:email,phone:countryCode+phone,country_code:countryCode,password:password}]);
    if(error){msg.innerText="Error: "+error.message;msg.style.color="red";}
    else{msg.innerText="Account Created! Redirecting to Login...";msg.style.color="#00ff88";setTimeout(()=>{window.location.href="login.html";},1500);}
  }
</script>
</body>
</html>
