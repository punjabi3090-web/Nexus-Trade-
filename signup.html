<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Create Account | NEXUS TRADE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #070312;
      --gold-main: #f59e0b;
      --gold-bright: #fbbf24;
      --input-bg: rgba(18, 12, 34, 0.85);
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 25%, #2a1548 0%, #0d0521 48%, #05020d 100%);
    }

    .bg-scene svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(8px, 1.5vh, 14px) clamp(12px, 3.5vw, 18px) clamp(12px, 2vh, 20px);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-mini-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.35);
    }

    .brand-mini-text {
      display: flex;
      flex-direction: column;
      line-height: 0.95;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(12px, 3.3vw, 14px);
      letter-spacing: 0.4px;
    }

    .brand-mini-text span:first-child { color: #ffffff; }
    .brand-mini-text span:last-child { color: #fbbf24; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(7px, 2.2vw, 12px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: #e5e7eb;
      font-size: clamp(10px, 2.6vw, 11.5px);
      font-weight: 500;
      transition: 0.2s;
    }

    .nav-item:hover { color: #fbbf24; }
    .nav-item svg {
      width: 13px;
      height: 13px;
      fill: #f59e0b;
      flex-shrink: 0;
    }

    .hero-brand {
      text-align: center;
      margin-top: clamp(2px, 0.6vh, 6px);
      flex-shrink: 0;
    }

    .hero-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hero-title {
      font-size: clamp(24px, 6.8vw, 32px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.8px;
      line-height: 1;
      text-shadow: 0 0 22px rgba(245, 158, 11, 0.45);
    }

    .hero-title .white { color: #ffffff; }
    .hero-title .gold {
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #fde047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-tagline {
      font-size: clamp(10.5px, 2.9vw, 12.5px);
      margin-top: 4px;
      font-weight: 500;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .hero-tagline span {
      color: #fbbf24;
      font-weight: 600;
    }

    .form-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: clamp(8px, 1.5vh, 14px);
      margin-bottom: clamp(6px, 1.5vh, 14px);
      min-height: 0;
    }

    .form-card {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 520px;
      background: linear-gradient(180deg, rgba(16, 9, 32, 0.92) 0%, rgba(10, 6, 22, 0.96) 100%);
      border: 1.5px solid #f59e0b;
      border-radius: 20px;
      box-shadow:
        0 0 22px rgba(245, 158, 11, 0.35),
        inset 0 0 18px rgba(245, 158, 11, 0.15);
      padding: clamp(22px, 3vh, 30px) clamp(14px, 4vw, 20px) clamp(12px, 1.5vh, 16px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-badge {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -52%);
      background: linear-gradient(180deg, #201308 0%, #0d061f 100%);
      border: 1.5px solid #f59e0b;
      border-radius: 999px;
      padding: clamp(5px, 0.9vh, 8px) clamp(18px, 5vw, 26px);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.55), inset 0 0 10px rgba(245, 158, 11, 0.2);
      z-index: 5;
    }

    .card-badge svg {
      width: clamp(18px, 4.5vw, 22px);
      height: clamp(18px, 4.5vw, 22px);
      fill: #fbbf24;
    }

    .card-badge-text {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 800;
      font-style: italic;
    }

    .card-badge-text .white { color: #ffffff; }
    .card-badge-text .gold { color: #fbbf24; }

    #signupForm {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      gap: clamp(10px, 1.8vh, 14px);
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      height: clamp(38px, 5vh, 44px);
      background: var(--input-bg);
      border: 1px solid rgba(245, 158, 11, 0.38);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .input-icon-box {
      width: clamp(38px, 10vw, 44px);
      height: 100%;
      background: linear-gradient(180deg, rgba(217, 119, 6, 0.55) 0%, rgba(180, 83, 9, 0.65) 100%);
      border-right: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-icon-box svg {
      width: 16px;
      height: 16px;
      fill: #fef3c7;
    }

    .input-field {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: clamp(12px, 3.3vw, 13.5px);
      padding: 0 12px;
      min-width: 0;
    }

    .input-field::placeholder {
      color: #cbd5e1;
      opacity: 0.82;
    }

    .country-select-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px 0 8px;
      border-right: 1px solid rgba(255, 255, 255, 0.22);
      height: 65%;
      flex-shrink: 0;
    }

    .country-select {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: clamp(11px, 3vw, 12.5px);
      font-weight: 600;
      cursor: pointer;
      padding-right: 2px;
    }

    .country-select option {
      background: #140b29;
      color: #ffffff;
    }

    .eye-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #e2e8f0;
    }

    .eye-btn svg {
      width: 17px;
      height: 17px;
      stroke: #e2e8f0;
      fill: none;
      stroke-width: 2;
    }

    .terms-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 2px;
      font-size: clamp(11.5px, 3vw, 12.5px);
      color: #e2e8f0;
    }

    .terms-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid #fbbf24;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      flex-shrink: 0;
    }

    .terms-row input[type="checkbox"]:checked {
      background: #f59e0b;
      border-color: #fbbf24;
    }

    .terms-row input[type="checkbox"]:checked::before {
      content: "✓";
      color: #070312;
      font-size: 11px;
      font-weight: 900;
    }

    .terms-row a {
      color: #fbbf24;
      text-decoration: underline;
      font-weight: 600;
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-signup-main {
      flex: 1;
      height: clamp(40px, 5.6vh, 48px);
      border-radius: 11px;
      border: 1.5px solid #fde047;
      background: linear-gradient(90deg, #b45309 0%, #f59e0b 45%, #d97706 100%);
      color: #ffffff;
      font-size: clamp(14.5px, 4vw, 16.5px);
      font-weight: 800;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: 0.2s;
    }

    .btn-signup-main:active { transform: scale(0.98); }
    .btn-signup-main:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-login-link {
      height: clamp(40px, 5.6vh, 48px);
      padding: 0 clamp(14px, 4vw, 20px);
      border-radius: 11px;
      border: 1.5px solid #f59e0b;
      background: rgba(18, 10, 36, 0.9);
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(13px, 3.5vh, 15px);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.35);
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn-login-link:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: #fbbf24;
    }

    .toast-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 999;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      max-width: 92%;
      text-align: center;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .toast-banner.show { transform: translateX(-50%) translateY(0); }
    .toast-error { background: #3b0d1e; border: 1px solid #f43f5e; color: #fecdd3; }
    .toast-success { background: #132e24; border: 1px solid #10b981; color: #a7f3d0; }
  </style>
</head>
<body>

  <div id="toastBox" class="toast-banner"></div>

  <div class="bg-scene">
    <svg viewBox="0 0 440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#b45309" stop-opacity="0.1"/>
          <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="goldWaveFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#070312" stop-opacity="0"/>
        </linearGradient>
        <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <g stroke="rgba(245,158,11,0.08)" stroke-width="1">
        <line x1="0" y1="160" x2="440" y2="160"/>
        <line x1="0" y1="220" x2="440" y2="220"/>
        <line x1="0" y1="780" x2="440" y2="780"/>
        <line x1="0" y1="830" x2="440" y2="830"/>
        <line x1="80" y1="0" x2="80" y2="900"/>
        <line x1="220" y1="0" x2="220" y2="900"/>
        <line x1="360" y1="0" x2="360" y2="900"/>
      </g>

      <path d="M -20 230 Q 110 280, 230 245 T 460 175 L 460 310 L -20 310 Z" fill="url(#goldWaveFill)"/>
      <path d="M -20 230 Q 110 280, 230 245 T 460 175" fill="none" stroke="url(#goldWaveGrad)" stroke-width="3" filter="url(#goldGlow)"/>
    </svg>
  </div>

  <div class="app-viewport">
    <header class="top-bar">
      <div class="brand-mini">
        <svg width="28" height="24" viewBox="0 0 40 34" fill="none">
          <path d="M3 29L13 7L21 21L31 5" stroke="#f59e0b" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 5H33V14" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-mini-divider"></div>
        <div class="brand-mini-text">
          <span>NEXUS</span>
          <span>TRADE</span>
        </div>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
          <span>Packages</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
          <span>Rewards</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/></svg>
          <span>Support</span>
        </a>
      </nav>
    </header>

    <section class="hero-brand">
      <div class="hero-logo-row">
        <svg width="38" height="34" viewBox="0 0 46 40" fill="none">
          <defs>
            <linearGradient id="barGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#b45309"/>
              <stop offset="100%" stop-color="#fbbf24"/>
            </linearGradient>
          </defs>
          <rect x="6" y="28" width="5" height="9" rx="1" fill="url(#barGrad)"/>
          <rect x="14" y="23" width="5" height="14" rx="1" fill="url(#barGrad)"/>
          <rect x="22" y="17" width="5" height="20" rx="1" fill="url(#barGrad)"/>
          <rect x="30" y="11" width="5" height="26" rx="1" fill="url(#barGrad)"/>
          <path d="M3 27C15 24 26 16 36 4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M28 4H37V13" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h1 class="hero-title">
          <span class="white">NEXUS</span> <span class="gold">TRADE</span>
        </h1>
      </div>
      <p class="hero-tagline">
        Smart Investment Packages &amp; <span>Daily Profit Ecosystem.</span>
      </p>
    </section>

    <main class="form-wrapper">
      <div class="form-card">
        <div class="card-badge">
          <svg viewBox="0 0 24 24">
            <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <div class="card-badge-text">
            <span class="white">Create</span> <span class="gold">Account</span>
          </div>
        </div>

        <form id="signupForm" autocomplete="off">
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <input type="text" id="fullName" class="input-field" placeholder="Full Name." required />
          </div>

          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <input type="text" id="userName" class="input-field" placeholder="User Name." required />
          </div>

          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <input type="email" id="email" class="input-field" placeholder="Email." required />
          </div>

          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </div>
            <div class="country-select-wrap">
              <span style="font-size: 13px;">🌐</span>
              <select id="countryCode" class="country-select">
                <option value="+92">+92</option>
                <option value="+971">+971</option>
                <option value="+966">+966</option>
                <option value="+91">+91</option>
                <option value="+44">+44</option>
                <option value="+1">+1</option>
              </select>
            </div>
            <input type="tel" id="phoneNo" class="input-field" placeholder="Phone No with country code." required />
          </div>

          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </div>
            <input type="password" id="password" class="input-field" placeholder="Password." minlength="6" required />
            <button type="button" class="eye-btn" onclick="togglePass('password', this)">
              <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>

          <div class="input-row">
            <div class="input-icon-box">
