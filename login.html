<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Login | NEXUS TRADE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #070312;
      --purple-main: #8b2cf5;
      --purple-bright: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.55);
      --input-bg: rgba(18, 12, 34, 0.85);
      --border-dim: rgba(168, 85, 247, 0.35);
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background Vector Canvas (Candlesticks, Waves & World Dots) */
    .bg-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 25%, #240b4c 0%, #0d0521 48%, #05020d 100%);
    }

    .bg-scene svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Main Auto-Fit Viewport Container */
    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(10px, 2vh, 16px) clamp(12px, 3.5vw, 18px) clamp(14px, 2.5vh, 22px);
    }

    /* Top Header Navigation */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-mini-divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.35);
    }

    .brand-mini-text {
      display: flex;
      flex-direction: column;
      line-height: 0.95;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(12px, 3.3vw, 14px);
      letter-spacing: 0.4px;
    }

    .brand-mini-text span:first-child { color: #ffffff; }
    .brand-mini-text span:last-child { color: #a855f7; }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(7px, 2.2vw, 12px);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: #e5e7eb;
      font-size: clamp(10px, 2.6vw, 11.5px);
      font-weight: 500;
      transition: 0.2s;
    }

    .nav-item:hover { color: #c084fc; }
    .nav-item svg {
      width: 13px;
      height: 13px;
      fill: #9333ea;
      flex-shrink: 0;
    }

    /* Hero Brand Center Section */
    .hero-brand {
      text-align: center;
      margin-top: clamp(4px, 1vh, 10px);
      flex-shrink: 0;
    }

    .hero-logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .hero-title {
      font-size: clamp(24px, 6.8vw, 32px);
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.8px;
      line-height: 1;
      text-shadow: 0 0 22px rgba(168, 85, 247, 0.45);
    }

    .hero-title .white { color: #ffffff; }
    .hero-title .purple {
      background: linear-gradient(90deg, #9333ea, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-tagline {
      font-size: clamp(10.5px, 2.9vw, 12.5px);
      margin-top: 4px;
      font-weight: 500;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .hero-tagline span {
      color: #c084fc;
      font-weight: 600;
    }

    /* Glowing Main Form Card */
    .form-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-top: clamp(16px, 3vh, 26px);
      margin-bottom: clamp(8px, 2vh, 16px);
      min-height: 0;
    }

    .form-card {
      position: relative;
      width: 100%;
      height: 100%;
      max-height: 420px;
      background: linear-gradient(180deg, rgba(16, 9, 32, 0.90) 0%, rgba(10, 6, 22, 0.95) 100%);
      border: 1.5px solid #a855f7;
      border-radius: 20px;
      box-shadow:
        0 0 22px rgba(168, 85, 247, 0.45),
        inset 0 0 18px rgba(139, 44, 245, 0.25);
      padding: clamp(30px, 4.5vh, 40px) clamp(14px, 4vw, 20px) clamp(16px, 2.5vh, 22px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Glowing Pill Badge: Welcome Back / Login */
    .card-badge {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -52%);
      background: linear-gradient(180deg, #1b0d36 0%, #0d061f 100%);
      border: 1.5px solid #b86bff;
      border-radius: 999px;
      padding: clamp(5px, 0.9vh, 8px) clamp(20px, 5.5vw, 28px);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.65), inset 0 0 10px rgba(168, 85, 247, 0.3);
      z-index: 5;
    }

    .card-badge svg {
      width: clamp(18px, 4.5vw, 22px);
      height: clamp(18px, 4.5vw, 22px);
      fill: #ffffff;
    }

    .card-badge-text {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 800;
      font-style: italic;
    }

    .card-badge-text .white { color: #ffffff; }
    .card-badge-text .purple { color: #b86bff; }

    /* Form Fields Layout */
    #loginForm {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: 100%;
      gap: clamp(8px, 1.5vh, 14px);
    }

    .input-row {
      display: flex;
      align-items: center;
      width: 100%;
      height: clamp(38px, 5.2vh, 45px);
      background: var(--input-bg);
      border: 1px solid rgba(168, 85, 247, 0.42);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-row:focus-within {
      border-color: #c084fc;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
    }

    .input-icon-box {
      width: clamp(38px, 10vw, 46px);
      height: 100%;
      background: linear-gradient(180deg, rgba(126, 34, 206, 0.55) 0%, rgba(88, 28, 135, 0.65) 100%);
      border-right: 1px solid rgba(168, 85, 247, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-icon-box svg {
      width: 16px;
      height: 16px;
      fill: #e9d5ff;
    }

    .input-field {
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: clamp(12px, 3.3vw, 13.5px);
      padding: 0 12px;
      min-width: 0;
    }

    .input-field::placeholder {
      color: #cbd5e1;
      opacity: 0.82;
    }

    /* Password Toggle Eye Button */
    .eye-btn {
      background: transparent;
      border: none;
      outline: none;
      padding: 0 12px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #e2e8f0;
    }

    .eye-btn svg {
      width: 17px;
      height: 17px;
      stroke: #e2e8f0;
      fill: none;
      stroke-width: 2;
    }

    /* Forgot Password Link */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      padding: 0 2px;
      margin-top: -4px;
    }

    .forgot-link {
      font-size: clamp(11.5px, 3vw, 12.5px);
      color: #c084fc;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .forgot-link:hover { text-decoration: underline; }

    /* Bottom Action Buttons Row */
    .actions-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-login-main {
      flex: 1;
      height: clamp(40px, 5.6vh, 48px);
      border-radius: 11px;
      border: 1.5px solid #d8b4fe;
      background: linear-gradient(90deg, #6b21a8 0%, #9333ea 45%, #7e22ce 100%);
      color: #ffffff;
      font-size: clamp(14.5px, 4vw, 16.5px);
      font-weight: 800;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(168, 85, 247, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      transition: 0.2s;
    }

    .btn-login-main:active { transform: scale(0.98); }
    .btn-login-main:disabled { opacity: 0.65; cursor: not-allowed; }

    .btn-signup-link {
      height: clamp(40px, 5.6vh, 48px);
      padding: 0 clamp(14px, 4vw, 20px);
      border-radius: 11px;
      border: 1.5px solid #9333ea;
      background: rgba(18, 10, 36, 0.9);
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(13px, 3.5vh, 15px);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 12px rgba(147, 51, 234, 0.35);
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn-signup-link:hover {
      background: rgba(147, 51, 234, 0.25);
      border-color: #c084fc;
    }

    /* Toast Notification Banner */
    .toast-banner {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-120%);
      z-index: 999;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 600;
      max-width: 92%;
      text-align: center;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    .toast-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-error {
      background: #3b0d1e;
      border: 1px solid #f43f5e;
      color: #fecdd3;
    }

    .toast-success {
      background: #132e24;
      border: 1px solid #10b981;
      color: #a7f3d0;
    }
  </style>
</head>
<body>

  <!-- Toast Message Box -->
  <div id="toastBox" class="toast-banner"></div>

  <!-- Exact Cyberpunk Candlestick & Glowing Waves Background -->
  <div class="bg-scene">
    <svg viewBox="0 0 440 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#581c87" stop-opacity="0.1"/>
          <stop offset="50%" stop-color="#a855f7" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="waveFill" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#9333ea" stop-opacity="0.32"/>
          <stop offset="100%" stop-color="#070312" stop-opacity="0"/>
        </linearGradient>
        <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Subtle Grid -->
      <g stroke="rgba(168,85,247,0.08)" stroke-width="1">
        <line x1="0" y1="160" x2="440" y2="160"/>
        <line x1="0" y1="220" x2="440" y2="220"/>
        <line x1="0" y1="780" x2="440" y2="780"/>
        <line x1="0" y1="830" x2="440" y2="830"/>
        <line x1="80" y1="0" x2="80" y2="900"/>
        <line x1="220" y1="0" x2="220" y2="900"/>
        <line x1="360" y1="0" x2="360" y2="900"/>
      </g>

      <!-- Top Candlesticks Left -->
      <g fill="#7e22ce" stroke="#a855f7" stroke-width="1" opacity="0.55">
        <line x1="22" y1="90" x2="22" y2="165"/><rect x="18" y="108" width="8" height="35"/>
        <line x1="38" y1="115" x2="38" y2="195"/><rect x="34" y="132" width="8" height="42"/>
        <line x1="54" y1="140" x2="54" y2="225"/><rect x="50" y="158" width="8" height="45"/>
        <line x1="70" y1="125" x2="70" y2="205"/><rect x="66" y="145" width="8" height="38"/>
      </g>

      <!-- Top Candlesticks Right -->
      <g fill="#7e22ce" stroke="#c084fc" stroke-width="1" opacity="0.55">
        <line x1="360" y1="190" x2="360" y2="265"/><rect x="356" y="205" width="8" height="38"/>
        <line x1="376" y1="165" x2="376" y2="245"/><rect x="372" y="182" width="8" height="40"/>
        <line x1="392" y1="145" x2="392" y2="225"/><rect x="388" y="160" width="8" height="42"/>
        <line x1="408" y1="120" x2="408" y2="200"/><rect x="404" y="138" width="8" height="36"/>
      </g>

      <!-- Upper Glowing Ribbon Wave -->
      <path d="M -20 230 Q 110 280, 230 245 T 460 175 L 460 310 L -20 310 Z" fill="url(#waveFill)"/>
      <path d="M -20 230 Q 110 280, 230 245 T 460 175" fill="none" stroke="url(#waveGrad1)" stroke-width="3" filter="url(#neonGlow)"/>

      <!-- Bottom Candlesticks -->
      <g fill="#6b21a8" stroke="#a855f7" stroke-width="1" opacity="0.5">
        <line x1="45" y1="765" x2="45" y2="835"/><rect x="41" y="780" width="8" height="34"/>
        <line x1="65" y1="780" x2="65" y2="850"/><rect x="61" y="795" width="8" height="32"/>
        <line x1="85" y1="755" x2="85" y2="825"/><rect x="81" y="772" width="8" height="30"/>
        <line x1="125" y1="775" x2="125" y2="845"/><rect x="121" y="790" width="8" height="35"/>
        <line x1="165" y1="760" x2="165" y2="835"/><rect x="161" y="775" width="8" height="38"/>
        <line x1="205" y1="785" x2="205" y2="860"/><rect x="201" y="800" width="8" height="36"/>
        <line x1="245" y1="770" x2="245" y2="845"/><rect x="241" y="788" width="8" height="32"/>
        <line x1="285" y1="755" x2="285" y2="830"/><rect x="281" y="770" width="8" height="38"/>
        <line x1="325" y1="775" x2="325" y2="850"/><rect x="321" y="792" width="8" height="34"/>
        <line x1="365" y1="760" x2="365" y2="835"/><rect x="361" y="778" width="8" height="35"/>
      </g>

      <!-- Bottom Glowing Ribbon Waves -->
      <path d="M -20 800 Q 120 885, 260 830 T 460 795 L 460 910 L -20 910 Z" fill="url(#waveFill)"/>
      <path d="M -20 800 Q 120 885, 260 830 T 460 795" fill="none" stroke="url(#waveGrad1)" stroke-width="3.5" filter="url(#neonGlow)"/>
      <path d="M -20 845 Q 150 795, 290 855 T 460 835" fill="none" stroke="url(#waveGrad1)" stroke-width="2" opacity="0.75"/>
    </svg>
  </div>

  <!-- Main Responsive Viewport -->
  <div class="app-viewport">

    <!-- Top Header Navigation -->
    <header class="top-bar">
      <div class="brand-mini">
        <svg width="28" height="24" viewBox="0 0 40 34" fill="none">
          <path d="M3 29L13 7L21 21L31 5" stroke="#9333ea" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M24 5H33V14" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-mini-divider"></div>
        <div class="brand-mini-text">
          <span>NEXUS</span>
          <span>TRADE</span>
        </div>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
          <span>Packages</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
          <span>Rewards</span>
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 1a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h3v-8H5v-2c0-3.87 3.13-7 7-7s7 3.13 7 7v2h-4v8h3c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/></svg>
          <span>Support</span>
        </a>
      </nav>
    </header>

    <!-- Center Hero Brand Header -->
    <section class="hero-brand">
      <div class="hero-logo-row">
        <svg width="38" height="34" viewBox="0 0 46 40" fill="none">
          <defs>
            <linearGradient id="barGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#6b21a8"/>
              <stop offset="100%" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
          <rect x="6" y="28" width="5" height="9" rx="1" fill="url(#barGrad)"/>
          <rect x="14" y="23" width="5" height="14" rx="1" fill="url(#barGrad)"/>
          <rect x="22" y="17" width="5" height="20" rx="1" fill="url(#barGrad)"/>
          <rect x="30" y="11" width="5" height="26" rx="1" fill="url(#barGrad)"/>
          <path d="M3 27C15 24 26 16 36 4" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M28 4H37V13" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <h1 class="hero-title">
          <span class="white">NEXUS</span> <span class="purple">TRADE</span>
        </h1>
      </div>
      <p class="hero-tagline">
        Smart Investment Packages &amp; <span>Daily Profit Ecosystem.</span>
      </p>
    </section>

    <!-- Glowing Form Container -->
    <main class="form-wrapper">
      <div class="form-card">

        <!-- Floating Top Pill Header: Login Account -->
        <div class="card-badge">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
          <div class="card-badge-text">
            <span class="white">Login</span> <span class="purple">Account</span>
          </div>
        </div>

        <form id="loginForm" autocomplete="off">

          <!-- 1. Email or User Name -->
          <div class="input-row">
            <div class="input-icon-box">
              <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <input type="text" id="emailOrUser" class="input-field" placeholder="Email or User Name." required />
          </div>

          <!-- 2. Password -->
          <div>
            <div class="input-row">
              <div class="input-icon-box">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
              </div>
              <input type="password" id="password" class="input-field" placeholder="Password." required />
              <button type="button" class="eye-btn" onclick="togglePass('password', this)">
                <svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
            <!-- Forgot Password Link -->
            <div class="forgot-row">
              <a href="#" class="forgot-link" onclick="event.preventDefault(); showToast('Password reset link sent to email.', 'success')">Forgot Password?</a>
            </div>
          </div>

          <!-- 3. Action Buttons: Login + Signup Link -->
          <div class="actions-row">
            <button type="submit" id="loginBtn" class="btn-login-main">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
              </svg>
              <span id="loginBtnText">Login Account</span>
              <span style="font-style: normal; letter-spacing: -2px;">»</span>
            </button>

            <a href="signup.html" class="btn-signup-link">
              <span>Signup</span>
              <span style="color: #c084fc; font-weight: 900;">→</span>
            </a>
          </div>

        </form>
      </div>
    </main>

  </div>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION (NEXUS TRADE DB)
    // ==========================================
    const SUPABASE_URL = "https://mzqduhqtdlvymeiouhxi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_NtapCzhK706QFomb1adwjQ_luVqjlfu";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Toast Alert Helper
    function showToast(msg, type = 'error') {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.className = `toast-banner show ${type === 'success' ? 'toast-success' : 'toast-error'}`;
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        box.classList.remove('show');
      }, 3500);
    }

    // Password Show/Hide Toggle
    function togglePass(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      }
    }

    // Login Form Submit Logic
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const identifier = document.getElementById('emailOrUser').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtnText.textContent = "Logging in...";

      try {
        let emailToUse = identifier;

        // Agar user ne username diya hai (email nahi hai), to profiles table se email find karein
        if (!identifier.includes('@')) {
          const { data: profileData, error: profileErr } = await supabaseClient
            .from('profiles')
            .select('email')
            .eq('username', identifier)
            .single();

          if (profileErr || !profileData) {
            throw new Error("Username not found. Please use your Email.");
          }
          emailToUse = profileData.email;
        }

        // Supabase Auth Sign In
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: emailToUse,
          password: password,
        });

        if (error) throw error;

        showToast("Login successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html"; // Agla step dashboard hoga
        }, 1300);

      } catch (err) {
        showToast(err.message || "Invalid login credentials.");
        loginBtn.disabled = false;
        loginBtnText.textContent = "Login Account";
      }
    });
  </script>
</body>
</html>
